<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff6f1">
<title>吃药服务</title>
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<main>
<header class="hero">
<div>
<p class="eyebrow"><span aria-hidden="true">✦</span> 我的用药小本本</p>
<h1>吃药服务</h1>
<p>吃了几粒、贴了几贴，顺手记一笔。</p>
</div>
<svg class="hero-art" viewBox="0 0 188 148" aria-hidden="true" focusable="false">
  <ellipse cx="96" cy="77" rx="71" ry="59" fill="#fbe0e6"/>
  <path d="M30 36v14m-7-7h14m113-24v16m-8-8h16m1 83v12m-6-6h12" fill="none" stroke="#b875a0" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="43" cy="108" r="3" fill="#b875a0"/>
  <g transform="rotate(-36 79 71)">
    <rect x="36" y="49" width="86" height="44" rx="22" fill="#fff6f3"/>
    <path d="M79 49h21a22 22 0 0 1 0 44H79Z" fill="#efa6b9"/>
    <rect x="36" y="49" width="86" height="44" rx="22" fill="none" stroke="#633f61" stroke-width="2.6"/>
    <circle cx="61" cy="69" r="2.4" fill="#633f61"/>
    <circle cx="91" cy="69" r="2.4" fill="#633f61"/>
    <path d="M71 73q5 7 10 0" fill="none" stroke="#633f61" stroke-width="2.3" stroke-linecap="round"/>
  </g>
  <g transform="rotate(24 130 100)">
    <rect x="107" y="72" width="46" height="56" rx="14" fill="#ffd69f" stroke="#633f61" stroke-width="2.6"/>
    <rect x="113" y="91" width="34" height="19" rx="6" fill="#fff1d7"/>
    <path d="M122 100h.1m15 0h.1" stroke="#633f61" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M127 103q3 4 6 0" fill="none" stroke="#633f61" stroke-width="1.7" stroke-linecap="round"/>
  </g>
</svg>
</header>
<div id="journal" hidden>
<section class="card" aria-labelledby="record-title">
<h2 id="record-title"><span class="section-icon peach" aria-hidden="true">☀️</span>今天的小记录</h2>
<p id="last">正在读取记录…</p>
<div id="medicines"></div>
<div class="record-actions">
<button class="primary" id="now">刚吃了，记一笔</button>
<button class="primary" id="add-med">＋ 添加药物</button>
<button id="manual">补记一笔</button>
</div>
<p role="status" id="status"></p>
<details id="medicine-management">
<summary>管理药物</summary>
<p>修改药名和图标，调整顺序，或收起暂时不用的药物。</p>
<div id="medicine-list"></div>
</details>
</section>
<section class="card" aria-labelledby="calendar-title">
<h2 id="calendar-title"><span class="section-icon lilac" aria-hidden="true">🗓️</span>用药小日历</h2>
<div id="calendar-filters" role="group" aria-label="按药物筛选日历"></div>
<div class="calendar-nav">
<button id="prev-month" aria-label="上个月">‹</button>
<h3 id="calendar-month" aria-live="polite"></h3>
<button id="next-month" aria-label="下个月">›</button>
</div>
<div class="calendar-grid weekdays" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>
<div class="calendar-grid" id="calendar-days" role="group" aria-labelledby="calendar-month"></div>
<div id="calendar-detail" aria-live="polite"></div>
</section>
<section class="card" aria-labelledby="history-title"><h2 id="history-title"><span class="section-icon peach" aria-hidden="true">📖</span>用药小本本</h2><div id="history"></div></section>
<section class="card" aria-labelledby="backup-title">
<h2 id="backup-title"><span class="section-icon lilac" aria-hidden="true">📦</span>备份小盒子</h2>
<p>记录保存在当前登录账号的云端小本本里。也可以导出一份备份，自己留好。</p>
<button id="export">导出备份</button>
<button id="import">导入备份</button>
<input id="file" type="file" accept=".json,application/json" hidden>
<p role="status" id="backup-status"></p>
</section>
</div>
<section class="card account-card" aria-labelledby="account-title">
<h2 id="account-title">☁️ 我的云端小本本</h2>
<p id="account-name">登录后，在不同设备继续记录</p>
<div class="record-actions">
<button id="login" class="primary">用 GitHub 登录</button>
<button id="logout" hidden>退出登录</button>
<button id="sync-retry">重新同步</button>
<button id="migrate-local" hidden>导入本机旧记录到账号</button>
</div>
<p id="sync-state" role="status">正在连接账号服务…</p>
</section>
</main>
<dialog id="medicine-editor">
<form id="medicine-form">
<h2 id="medicine-title">添加药物</h2>
<label for="medicine-name">药物名称或代号</label>
<input id="medicine-name" maxlength="60" required>
<label for="medicine-kind">类型</label>
<select id="medicine-kind"><option value="oral">口服药</option><option value="patch">贴剂</option></select>
<label for="medicine-icon">药物图标</label>
<select id="medicine-icon"></select>
<div class="actions"><button type="button" id="medicine-cancel">取消</button><button class="primary" id="medicine-save">添加</button></div>
<p role="status" id="medicine-status"></p>
</form>
</dialog>
<dialog id="editor">
<form id="edit-form">
<h2 id="edit-title">补记时间</h2>
<div id="medicine-fields" hidden>
<label for="record-medicine">药物</label>
<select id="record-medicine"></select>
<label id="quantity-label" for="quantity">这次用量</label>
<input id="quantity" type="number" min="1" max="999" step="1" value="1">
</div>
<label for="when">服药日期和时间</label>
<input id="when" type="datetime-local" required>
<div class="actions"><button type="button" id="cancel">取消</button><button class="primary" type="submit">保存</button></div>
<p role="status" id="edit-status"></p>
</form>
</dialog>
</body>
</html>
